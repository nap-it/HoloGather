[CAMERA]
# Camera parameters
# Ignored in shared mode
width = 1280
height = 720
framerate = 30
# Framerate denominator (must be > 0)
# Effective FPS is framerate / divisor
divisor = 1
# Video encoding profile
profile = H265_MAIN
# GOP size: number of frames between keyframes (I-frames).
# Smaller value = more frequent keyframes = shorter stream breaks after a
# dropped packet, at the cost of higher bitrate.
gop_size = 2
# Topic for frame publishing
publish_topic = Hololens/RGBCamera
# Stream Port
port = PERSONAL_VIDEO

[DEPTH_CAMERA]
# Type of depth sensor:
# RM_DEPTH_LONGTHROW: 320 x 288 @ 5 fps
# RM_DEPTH_AHAT: 512 x 512 @ 45 fps
depth_sensor = RM_DEPTH_LONGTHROW
# Topic for frame publishing
topic = Hololens/DepthCamera
port = RM_DEPTH_LONGTHROW

[MICROPHONE]
# Audio stream profile
# Options: RAW, AAC_24000, AAC_48000
profile = AAC_24000
# Chunk size (ignored for decoded streams, optional)
chunk = MICROPHONE
# Decoding level (only used for AAC)
level = L2
# Acquisition forwards the encoded hl2ss packet; subscribers decode it.
# This compatibility field is currently ignored by the publisher handler.
decoded = False
# Topic for audio frame publishing
publish_topic = Hololens/Microphone
port = MICROPHONE

[EET]
# Topic for EET data publishing
topic = Hololens/EET
# Target framerate for eye tracking (valid: 30, 60, 90)
framerate = 30
decoded = False
port = EXTENDED_EYE_TRACKER

[SPATIAL_INPUT]
# Topic for spatial input publishing
topic = Hololens/SpatialInput
decoded = False
port = SPATIAL_INPUT

[ACCELEROMETER]
topic = Hololens/IMU/Accelerometer
port = RM_IMU_ACCELEROMETER
# Stream Mode
mode = MODE_1

[GYROSCOPE]
topic = Hololens/IMU/Gyroscope
port = RM_IMU_GYROSCOPE
# Stream Mode
mode = MODE_1

[MAGNETOMETER]
topic = Hololens/IMU/Magnetometer
port = RM_IMU_MAGNETOMETER
# Stream Mode
mode = MODE_1

[IMU]
decoded = False

[VLC]
divisor = 1
profile = H265_MAIN
gop_size = 2
decoded = False
leftfront_topic = Hololens/VLC/leftfront
leftleft_topic = Hololens/VLC/leftleft
rightfront_topic = Hololens/VLC/rightfront
rightright_topic = Hololens/VLC/rightright

[SINK_MANAGER]
buffer_size = 150

[locator]
mqtt_host = 127.0.0.1
mqtt_port = 1883
vam_location_topic = vanetza/in/vam
phone_location_topic_owntrack = owntracks/user/phone
# Credentials are intentionally empty in the public example. Supply them via
# MQTT_USERNAME / MQTT_PASSWORD or --mqtt-username / --mqtt-password.
mqtt_username =
mqtt_password =

[UNITY]
heading_topic = camera_heading
orientation_topic = hololens/orientation

[ZENOH]
config_file =
use_shm = False
shm_arena_size = 16777216
