[sensors]

list =
    ; hololens_imu:sensor=accelerometer;
    ; hololens_imu:sensor=gyroscope;
    ; hololens_imu:sensor=magnetometer;
    ; hololens_vlc:sensor=RM_VLC_LEFTLEFT, RM_VLC_LEFTFRONT, RM_VLC_RIGHTFRONT, RM_VLC_RIGHTRIGHT;
    hololens_camera;
    hololens_depth;
    ; hololens_imu:sensor=all;
    ; hololens_vlc:sensor=all;
    ; hololens_si;
    ; hololens_eet;
    hololens_microphone;
    ; depth_correlator;
    vam_location;
    phone_location;
    unity_heading;
    unity_imu;
    
[settings]
log_level = DEBUG
sensor_config_file = sensors_config.ini
# Set this to the HoloLens address in your local environment (or use
# HOLOLENS_ADDRESS / --hololens-address). 127.0.0.1 is a safe placeholder.
hololens_address = 127.0.0.1
hololens_user_id = 1
# Simulation and recording modes can't be active at the same time
record_mode = False
simulation_mode = False
# Publish sensor data to Zenoh (independent of record/simulation)
publish_mode = False
data_dir = /root/app/recordings
# Video/audio payloads are already H265/H264/AAC compressed — LZ4 adds no space
# savings and blocks the main acquisition loop on every frame. Use none.
recording_compression = none
