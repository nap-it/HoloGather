[message-configuration]
messageType = VAM
ignore_rules = false
vamClustering = 0
force_cluster_operation = 0 ;0no,1create,2 join,3 leave 4break

[station-info]
# Example station identifier; replace for your deployment.
stationID = 1
stationType = 2 ;2 if bike, 5 if car ; 15 if RSU

[vehicle-characteristics]
vehicleLength = 6
vehicleWidth = 1.5
vehicleRole = 0

[vru-characteristics]
vruProfile = 2

[optional-parameters-vru]
;HighFrequencyContainer
curvature = 
curvatureCalculationMode = 
yawRate =  
longitudinalAcceleration =  
verticalAcceleration =  
lateralAcceleration =  
vruLanePosition = ;not good for now only v2 for the vams
environment = 
movementControl =
orientation = True  ;not good for now
rollAngle = ;not good for now
deviceUsage = 
;vruLowFrequencyContainer
sizeClass = 
exteriorLights = 

[messageSender]
performance_logs = true

[mqtt-messageSender]
host=127.0.0.1
port=1883
user=""
password=""
topic_publish = vanetza/in/vam
topic_subscribe = ""

[mqtt-dataReceiver]
host=127.0.0.1
port=1883
user=""
password=""
topic_publish = ""
topic_subscribe = messenger/adapters

[mqtt-VRUcluster]
host=127.0.0.1
port=1883
user=""
password=""
topic_publish = ""
topic_subscribe = vanetza/out/cam_full

[dcc]
Toff = 100
max_length = 1200
ignore_max_length = false
equation_constant = 85
equation_coefficient_station_type = 14.67
equation_coefficient_low_frequency = 2.41
equation_coefficient_path_size = 8.62
equation_coefficient_special_vehicle = 0.72
performance_logs = false

[mqtt-dcc]
host = 127.0.0.1
port = 1883
topic_subscribe = dcc/facilities/cam
topic_publish = dcc/facilities/request

[spdlog]
level=info
