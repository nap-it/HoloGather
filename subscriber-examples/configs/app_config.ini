[settings]
log_level = DEBUG
hololens_user_id = 1
metrics_port = 8686

[sensors]
list =
    hololens_camera;
    hololens_depth;
    ; hololens_imu:sensor=all;
    ; hololens_imu:sensor=accelerometer;
    ; hololens_imu:sensor=gyroscope;
    ; hololens_imu:sensor=magnetometer;
    ; hololens_si;
    ; hololens_eet;
    ; hololens_vlc:sensor=leftleft;
    ; hololens_vlc:sensor=leftfront;
    ; hololens_vlc:sensor=rightfront;
    ; hololens_vlc:sensor=rightright;
    hololens_microphone;
    vam_location;
    phone_location;
    unity_heading;
    unity_imu;
    map;
    ; depth_correlator;
    
[CAMERA]
topic = Hololens/RGBCamera
host = 127.0.0.1
rtsp_port = 8554
path = pv_camera
stream_name = pv_camera
video_stream_buffer_size = 2
sensor_queue_size = 120
profile = H265_MAIN
stream_fps = 30

[DEPTH_CAMERA] 
topic = Hololens/DepthCamera
port = 9001
host = 127.0.0.1
path = depth_camera
stream_name = depth_camera
video_stream_buffer_size = 2
sensor_queue_size = 25
depth_sensor = RM_DEPTH_LONGTHROW
stream_fps = 5

[IMU]
topic = Hololens/IMU
sensor_queue_size = 25

[SPATIAL_INPUT]
topic = Hololens/SpatialInput
sensor_queue_size = 25

[EET]
topic = Hololens/EET
sensor_queue_size = 25

[VLC]
topic = Hololens/VLC
host = 127.0.0.1
rtsp_port = 8554
path = vlc_camera
stream_name = vlc_camera
video_stream_buffer_size = 2
sensor_queue_size = 25
profile = H265_MAIN
stream_fps = 30

[MICROPHONE]
sensor_queue_size = 10
profile = AAC_24000

[VAM_LOCATION]
topic = Hololens/VamLocation

[PHONE_LOCATION]
topic = Hololens/PhoneLocation

[HEADING]
topic = Hololens/Heading

[UNITY_IMU]
topic = Hololens/UnityIMU

[MAP]
; Live map view of GPS + heading (reuses VAM_LOCATION / PHONE_LOCATION / HEADING
; topics). Open http://localhost:<web_port>/ alongside your RGB web view.
web_port = 8797
sensor_queue_size = 25
; Optional: overlay the raw gpsd receiver position (green) for ground-truth
; comparison on LIVE runs. Leave blank to disable. gpsd must be reachable
; (start it with `-G` or ssh-tunnel port 2947).
gpsd_host =
gpsd_port = 2947
